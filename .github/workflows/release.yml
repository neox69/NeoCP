name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Creates tag v<version> on the selected branch."
        required: true
        default: "1.0.0"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev libportaudio2
      - run: pip install -e ".[dev]" build
      - run: python scripts/build_midi_remote.py
      - run: pytest -q
      - run: python -m build
      - run: python scripts/make_release.py --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NeoCP ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/NeoCP_Bridge.midiremote
            dist/NeoCP_Bridge.js
