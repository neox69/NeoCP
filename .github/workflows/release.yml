name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev libportaudio2
      - run: pip install -e ".[dev]" build
      - run: python scripts/build_midi_remote.py
      - run: pytest -q
      - run: python -m build
      - run: python scripts/make_release.py --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          name: NeoCP ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/NeoCP_Bridge.midiremote
            dist/NeoCP_Bridge.js
