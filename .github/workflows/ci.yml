name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev libportaudio2
      - run: pip install -e ".[dev]"
      - run: python scripts/build_midi_remote.py && git diff --exit-code -- neocp/midi_remote
      - run: pytest -q
