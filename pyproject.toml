[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neocp"
version = "1.3.2"
description = "MCP server for Steinberg Cubase / Nuendo: full bidirectional control through the MIDI Remote API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "numpy>=1.24",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
neocp = "neocp.server:main"
neocp-install = "neocp.install:main"

[tool.hatch.build.targets.wheel]
packages = ["neocp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
