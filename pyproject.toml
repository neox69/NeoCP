[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubase-mcp"
version = "1.0.0"
description = "MCP server for Steinberg Cubase / Nuendo: full bidirectional control through the MIDI Remote API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cubase-mcp = "cubase_mcp.server:main"
cubase-mcp-install = "cubase_mcp.install:main"

[tool.hatch.build.targets.wheel]
packages = ["cubase_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
